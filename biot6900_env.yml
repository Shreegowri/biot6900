name: biot6900
channels:
  - defaults
dependencies:
  - python=3.12 #changed from 3.11 as squidpy requires later version of python
  - pip
  - pip:
      # Jupyter and existing course packages
      - jupyter
      - nbconvert
      - nbclient==0.10.2
      - ipykernel==6.29.5
      - biopython==1.88
      - requests==2.34.2
      - matplotlib==3.11.2
      - scikit-learn==1.9.1
      - neo4j==5.28.2
      - networkx==3.4.2
      - python-dotenv==1.1.0

      # Numerical libraries used in the executed Module 8 notebook
      - numpy==2.5.5
      - pandas==3.1.1
      - scipy==1.18.1

      # Single-cell data, spatial analysis and integration
      - scanpy==1.11.5
      - squidpy==1.8.4
      # Live Census access uses the Linux/macOS binaries. Windows reads the bundled .h5ad.
      - "cellxgene-census==1.18.0; sys_platform != 'win32'"
      - "tiledbsoma==2.2.0; sys_platform != 'win32'"
      - anndata==0.13.4
      - scvi-tools==1.4.3
      - harmonypy==0.1.0
      - torch==2.8.0

      # Seurat v3 highly variable genes, Leiden clustering and UMAP
      - scikit-misc==0.5.3
      - igraph==1.0.0
      - leidenalg==0.12.0
      - umap-learn==0.5.12
